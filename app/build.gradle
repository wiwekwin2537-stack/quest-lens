plugins {
    id 'com.android.application'
}

android {
    namespace 'com.questlens.recorder'
    compileSdk 35

    defaultConfig {
        applicationId 'com.questlens.recorder'
        minSdk 34
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
